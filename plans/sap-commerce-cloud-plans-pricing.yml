description: SAP Commerce Cloud (formerly Hybris) is sold via SAP enterprise sales as a subscription tied to GMV, environment count, and sandbox/non-production instances. Pricing is contract-negotiated; no public rate card.
sources:
  - https://www.sap.com/products/crm/commerce-cloud.html
  - https://help.sap.com/docs/SAP_COMMERCE_CLOUD_PUBLIC_CLOUD
notes: Public pricing pages for this provider return HTTP 403 to automated fetches or require partner/sales engagement; trimmed to a single Contact Sales plan until a published rate card is available.
plans:
  - id: sap-commerce-cloud-contact-sales
    name: Contact Sales
    type: enterprise
    description: All commercial terms are negotiated through SAP sales, the SAP Store, or SAP partners.
    entries:
      - label: Custom contract
        name: custom
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: SAP Sales Engagement
      - name: SAP Store
      - name: SAP Partner Channel
