naftiko: 1.0.0-alpha2
info:
  label: SAP Commerce Cloud Commerce Web Services API — Addresses
  description: 'SAP Commerce Cloud Commerce Web Services API — Addresses. 5 operations. Lead operation: SAP Commerce Cloud
    List user addresses. Self-contained Naftiko capability covering one Sap Commerce Cloud business surface.'
  tags:
