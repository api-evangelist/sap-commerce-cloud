    namespace: commerce-web-services-addresses-rest
    port: 8080
    description: REST adapter for SAP Commerce Cloud Commerce Web Services API — Addresses. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/users/{userid}/addresses
      name: users-userid-addresses
      description: REST surface for users-userId-addresses.
      operations:
      - method: GET
        name: getuseraddresses
        description: SAP Commerce Cloud List user addresses
        call: commerce-web-services-addresses.getuseraddresses
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createuseraddress
        description: SAP Commerce Cloud Create a user address
        call: commerce-web-services-addresses.createuseraddress
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{userid}/addresses/{addressid}
      name: users-userid-addresses-addressid
