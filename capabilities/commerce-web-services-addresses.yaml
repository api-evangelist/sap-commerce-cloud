    description: SAP Commerce Cloud Commerce Web Services API — Addresses business capability. Self-contained, no shared references.
    resources:
    - name: users-userId-addresses
      path: /users/{userId}/addresses
      operations:
      - name: getuseraddresses
        method: GET
        description: SAP Commerce Cloud List user addresses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createuseraddress
        method: POST
        description: SAP Commerce Cloud Create a user address
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: users-userId-addresses-addressId
