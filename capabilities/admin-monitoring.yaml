naftiko: 1.0.0-alpha2
info:
  label: SAP Commerce Cloud Admin API — Monitoring
  description: 'SAP Commerce Cloud Admin API — Monitoring. 1 operations. Lead operation: SAP Commerce Cloud Get system metrics.
    Self-contained Naftiko capability covering one Sap Commerce Cloud business surface.'
  tags:
  - Sap Commerce Cloud
  - Monitoring
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_COMMERCE_CLOUD_API_KEY: SAP_COMMERCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-monitoring
    baseUri: https://{tenant}.{region}.commercecloud.sap
    description: SAP Commerce Cloud Admin API — Monitoring business capability. Self-contained, no shared references.
    resources:
    - name: monitoring-metrics
      path: /monitoring/metrics
      operations:
      - name: getsystemmetrics
        method: GET
        description: SAP Commerce Cloud Get system metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAP_COMMERCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-monitoring-rest
    port: 8080
    description: REST adapter for SAP Commerce Cloud Admin API — Monitoring. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/monitoring/metrics
      name: monitoring-metrics
      description: REST surface for monitoring-metrics.
      operations:
      - method: GET
        name: getsystemmetrics
        description: SAP Commerce Cloud Get system metrics
        call: admin-monitoring.getsystemmetrics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-monitoring-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Commerce Cloud Admin API — Monitoring. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: sap-commerce-cloud-get-system
      description: SAP Commerce Cloud Get system metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-monitoring.getsystemmetrics
      outputParameters:
      - type: object
        mapping: $.
