naftiko: "1.0.0-alpha1"

info:
  label: "SAP Commerce Cloud Product Content Management API"
  description: "API for managing product content in SAP Commerce Cloud including product catalog management, category structures, product attributes, images, and pricing information."
  tags:
    - Commerce
    - Content Management
    - Products
    - SAP
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SAP_COMMERCE_OAUTH_TOKEN: SAP_COMMERCE_OAUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: sap-commerce-pcm
      baseUri: https://{tenant}.{region}.commercecloud.sap/occ/v2/{baseSiteId}
      description: "SAP Commerce Cloud Product Content Management via OCC API."
      authentication:
        type: bearer
        token: "{{SAP_COMMERCE_OAUTH_TOKEN}}"
      resources:
        - name: catalogs
          path: /catalogs
          description: "Product catalog management."
          operations:
            - name: list-catalogs
              method: GET
              description: "List available product catalogs."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-catalog
              method: GET
              description: "Get details of a specific catalog."
              inputParameters:
                - name: catalogId
                  in: path
                  type: string
                  required: true
                  description: "Catalog identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: categories
          path: /catalogs/{catalogId}/versions/{catalogVersionId}/categories
          description: "Category management within a catalog."
          operations:
            - name: list-categories
              method: GET
              description: "List categories in a catalog version."
              inputParameters:
                - name: catalogId
                  in: path
                  type: string
                  required: true
                  description: "Catalog identifier"
                - name: catalogVersionId
                  in: path
                  type: string
                  required: true
                  description: "Catalog version identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: sap-commerce-pcm-api
      resources:
        - path: /v1/catalogs
          name: catalogs
          description: "Product catalogs."
          operations:
            - method: GET
              name: list-catalogs
              description: "List product catalogs."
              call: "sap-commerce-pcm.list-catalogs"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: sap-commerce-pcm-mcp
      transport: http
      tools:
        - name: list-catalogs
          description: "List available product catalogs in SAP Commerce Cloud."
          hints:
            readOnly: true
            openWorld: true
          call: "sap-commerce-pcm.list-catalogs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-catalog
          description: "Get the structure and versions of a specific product catalog."
          hints:
            readOnly: true
            openWorld: false
          call: "sap-commerce-pcm.get-catalog"
          with:
            catalogId: "tools.catalogId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-categories
          description: "List product categories in a catalog version."
          hints:
            readOnly: true
            openWorld: true
          call: "sap-commerce-pcm.list-categories"
          with:
            catalogId: "tools.catalogId"
            catalogVersionId: "tools.catalogVersionId"
          outputParameters:
            - type: object
              mapping: "$."
