naftiko: "1.0.0-alpha1"

info:
  label: "SAP Commerce Cloud Assisted Service Module API"
  description: "API for assisted service capabilities in SAP Commerce Cloud, enabling customer service representatives to assist customers with their shopping experience including cart management and order support."
  tags:
    - Commerce
    - Customer Experience
    - Customer Service
    - SAP
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SAP_COMMERCE_OAUTH_TOKEN: SAP_COMMERCE_OAUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: sap-commerce-asm
      baseUri: https://{tenant}.{region}.commercecloud.sap/assistedservicewebservices
      description: "SAP Commerce Cloud Assisted Service Module REST API."
      authentication:
        type: bearer
        token: "{{SAP_COMMERCE_OAUTH_TOKEN}}"
      resources:
        - name: customers
          path: /customers
          description: "Customer search and management for assisted service."
          operations:
            - name: search-customers
              method: GET
              description: "Search for customers by name or email to assist."
              inputParameters:
                - name: query
                  in: query
                  type: string
                  required: false
                  description: "Search query (name, email, or account number)"
                - name: pageSize
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of results"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: customer-support-tickets
          path: /tickets
          description: "Customer support ticket management."
          operations:
            - name: create-ticket
              method: POST
              description: "Create a customer support ticket."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  customerId: "{{tools.customerId}}"
                  subject: "{{tools.subject}}"
                  message: "{{tools.message}}"
            - name: list-tickets
              method: GET
              description: "List support tickets for a customer."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: sap-commerce-asm-api
      resources:
        - path: /v1/customers
          name: customers
          description: "Customer search for ASM."
          operations:
            - method: GET
              name: search-customers
              description: "Search customers."
              call: "sap-commerce-asm.search-customers"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: sap-commerce-asm-mcp
      transport: http
      tools:
        - name: search-customers
          description: "Search for customers by name or email for assisted service."
          hints:
            readOnly: true
            openWorld: true
          call: "sap-commerce-asm.search-customers"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-support-ticket
          description: "Create a customer support ticket for a commerce issue."
          hints:
            readOnly: false
            idempotent: false
          call: "sap-commerce-asm.create-ticket"
          with:
            customerId: "tools.customerId"
            subject: "tools.subject"
            message: "tools.message"
          outputParameters:
            - type: object
              mapping: "$."
