naftiko: 1.0.0-alpha2
info:
  label: SAP Commerce Cloud Integration API — Metadata
  description: 'SAP Commerce Cloud Integration API — Metadata. 1 operations. Lead operation: SAP Commerce Cloud Get service
    metadata. Self-contained Naftiko capability covering one Sap Commerce Cloud business surface.'
  tags:
  - Sap Commerce Cloud
  - Metadata
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_COMMERCE_CLOUD_API_KEY: SAP_COMMERCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: integration-metadata
    baseUri: https://{tenant}.{region}.commercecloud.sap/odata2webservices
    description: SAP Commerce Cloud Integration API — Metadata business capability. Self-contained, no shared references.
    resources:
    - name: $metadata
      path: /$metadata
      operations:
      - name: getmetadata
        method: GET
        description: SAP Commerce Cloud Get service metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAP_COMMERCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: integration-metadata-rest
    port: 8080
    description: REST adapter for SAP Commerce Cloud Integration API — Metadata. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/metadata
      name: metadata
      description: REST surface for $metadata.
      operations:
      - method: GET
        name: getmetadata
        description: SAP Commerce Cloud Get service metadata
        call: integration-metadata.getmetadata
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: integration-metadata-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Commerce Cloud Integration API — Metadata. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: sap-commerce-cloud-get-service
      description: SAP Commerce Cloud Get service metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: integration-metadata.getmetadata
      outputParameters:
      - type: object
        mapping: $.
