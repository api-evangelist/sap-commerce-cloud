naftiko: 1.0.0-alpha2
info:
  label: SAP Commerce Cloud Admin API — CronJobs
  description: 'SAP Commerce Cloud Admin API — CronJobs. 3 operations. Lead operation: SAP Commerce Cloud List CronJobs. Self-contained
    Naftiko capability covering one Sap Commerce Cloud business surface.'
  tags:
  - Sap Commerce Cloud
  - CronJobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_COMMERCE_CLOUD_API_KEY: SAP_COMMERCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-cronjobs
    baseUri: https://{tenant}.{region}.commercecloud.sap
    description: SAP Commerce Cloud Admin API — CronJobs business capability. Self-contained, no shared references.
    resources:
    - name: monitoring-cronjobs
      path: /monitoring/cronjobs
      operations:
      - name: listcronjobs
        method: GET
        description: SAP Commerce Cloud List CronJobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by CronJob status
    - name: monitoring-cronjobs-cronJobCode
      path: /monitoring/cronjobs/{cronJobCode}
      operations:
      - name: getcronjob
        method: GET
        description: SAP Commerce Cloud Get CronJob details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cronJobCode
          in: path
          type: string
          description: CronJob code
          required: true
    - name: monitoring-cronjobs-cronJobCode-execute
      path: /monitoring/cronjobs/{cronJobCode}/execute
      operations:
      - name: executecronjob
        method: POST
        description: SAP Commerce Cloud Execute a CronJob
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cronJobCode
          in: path
          type: string
          description: CronJob code
          required: true
    authentication:
      type: bearer
      token: '{{env.SAP_COMMERCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-cronjobs-rest
    port: 8080
    description: REST adapter for SAP Commerce Cloud Admin API — CronJobs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/monitoring/cronjobs
      name: monitoring-cronjobs
      description: REST surface for monitoring-cronjobs.
      operations:
      - method: GET
        name: listcronjobs
        description: SAP Commerce Cloud List CronJobs
        call: admin-cronjobs.listcronjobs
        with:
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/monitoring/cronjobs/{cronjobcode}
      name: monitoring-cronjobs-cronjobcode
      description: REST surface for monitoring-cronjobs-cronJobCode.
      operations:
      - method: GET
        name: getcronjob
        description: SAP Commerce Cloud Get CronJob details
        call: admin-cronjobs.getcronjob
        with:
          cronJobCode: rest.cronJobCode
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/monitoring/cronjobs/{cronjobcode}/execute
      name: monitoring-cronjobs-cronjobcode-execute
      description: REST surface for monitoring-cronjobs-cronJobCode-execute.
      operations:
      - method: POST
        name: executecronjob
        description: SAP Commerce Cloud Execute a CronJob
        call: admin-cronjobs.executecronjob
        with:
          cronJobCode: rest.cronJobCode
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-cronjobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Commerce Cloud Admin API — CronJobs. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: sap-commerce-cloud-list-cronjobs
      description: SAP Commerce Cloud List CronJobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-cronjobs.listcronjobs
      with:
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-commerce-cloud-get-cronjob
      description: SAP Commerce Cloud Get CronJob details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-cronjobs.getcronjob
      with:
        cronJobCode: tools.cronJobCode
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-commerce-cloud-execute-cronjob
      description: SAP Commerce Cloud Execute a CronJob
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: admin-cronjobs.executecronjob
      with:
        cronJobCode: tools.cronJobCode
      outputParameters:
      - type: object
        mapping: $.
