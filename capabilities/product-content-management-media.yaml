naftiko: 1.0.0-alpha2
info:
  label: SAP Commerce Cloud Product Content Management API — Media
  description: 'SAP Commerce Cloud Product Content Management API — Media. 1 operations. Lead operation: SAP Commerce Cloud
    Get product images. Self-contained Naftiko capability covering one Sap Commerce Cloud business surface.'
  tags:
  - Sap Commerce Cloud
  - Media
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_COMMERCE_CLOUD_API_KEY: SAP_COMMERCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: product-content-management-media
    baseUri: https://{tenant}.{region}.commercecloud.sap/occ/v2/{baseSiteId}
    description: SAP Commerce Cloud Product Content Management API — Media business capability. Self-contained, no shared
      references.
    resources:
    - name: products-productCode-images
      path: /products/{productCode}/images
      operations:
      - name: getproductimages
        method: GET
        description: SAP Commerce Cloud Get product images
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAP_COMMERCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: product-content-management-media-rest
    port: 8080
    description: REST adapter for SAP Commerce Cloud Product Content Management API — Media. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/products/{productcode}/images
      name: products-productcode-images
      description: REST surface for products-productCode-images.
      operations:
      - method: GET
        name: getproductimages
        description: SAP Commerce Cloud Get product images
        call: product-content-management-media.getproductimages
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: product-content-management-media-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Commerce Cloud Product Content Management API — Media. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: sap-commerce-cloud-get-product
      description: SAP Commerce Cloud Get product images
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: product-content-management-media.getproductimages
      outputParameters:
      - type: object
        mapping: $.
