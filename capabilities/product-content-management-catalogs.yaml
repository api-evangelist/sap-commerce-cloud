naftiko: 1.0.0-alpha2
info:
  label: SAP Commerce Cloud Product Content Management API — Catalogs
  description: 'SAP Commerce Cloud Product Content Management API — Catalogs. 1 operations. Lead operation: SAP Commerce Cloud
    Get catalog version details. Self-contained Naftiko capability covering one Sap Commerce Cloud business surface.'
  tags:
  - Sap Commerce Cloud
  - Catalogs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_COMMERCE_CLOUD_API_KEY: SAP_COMMERCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: product-content-management-catalogs
    baseUri: https://{tenant}.{region}.commercecloud.sap/occ/v2/{baseSiteId}
    description: SAP Commerce Cloud Product Content Management API — Catalogs business capability. Self-contained, no shared
      references.
    resources:
    - name: catalogs-catalogId-catalogVersionId
      path: /catalogs/{catalogId}/{catalogVersionId}
      operations:
      - name: getcatalogversion
        method: GET
        description: SAP Commerce Cloud Get catalog version details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: catalogId
          in: path
          type: string
          description: Catalog identifier
          required: true
        - name: catalogVersionId
          in: path
          type: string
          description: Catalog version (e.g., Online, Staged)
          required: true
    authentication:
      type: bearer
      token: '{{env.SAP_COMMERCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: product-content-management-catalogs-rest
    port: 8080
    description: REST adapter for SAP Commerce Cloud Product Content Management API — Catalogs. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/catalogs/{catalogid}/{catalogversionid}
      name: catalogs-catalogid-catalogversionid
      description: REST surface for catalogs-catalogId-catalogVersionId.
      operations:
      - method: GET
        name: getcatalogversion
        description: SAP Commerce Cloud Get catalog version details
        call: product-content-management-catalogs.getcatalogversion
        with:
          catalogId: rest.catalogId
          catalogVersionId: rest.catalogVersionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: product-content-management-catalogs-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Commerce Cloud Product Content Management API — Catalogs. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: sap-commerce-cloud-get-catalog
      description: SAP Commerce Cloud Get catalog version details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: product-content-management-catalogs.getcatalogversion
      with:
        catalogId: tools.catalogId
        catalogVersionId: tools.catalogVersionId
      outputParameters:
      - type: object
        mapping: $.
