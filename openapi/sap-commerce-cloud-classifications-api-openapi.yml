openapi: 3.2.0
info:
  title: SAP Commerce Cloud Product Content Management…
  description: API for managing product content in SAP Commerce Cloud including product images, descriptions, attributes, media, and catalog content. Provides operations for product data enrichment, media management, and content publication workflows.
  version: '2.0'
  contact:
    name: SAP Support
    url: https://support.sap.com/
  termsOfService: https://www.sap.com/about/legal/terms-of-use.html
servers:
- url: https://{tenant}.{region}.commercecloud.sap/occ/v2/{baseSiteId}
  description: SAP Commerce Cloud Production
  variables:
    tenant:
      description: Tenant identifier
      default: my-tenant
    region:
      description: Deployment region
      default: us
    baseSiteId:
      description: Base site identifier
      default: electronics
security:
- oauth2: []
tags:
- name: Classifications
  description: Product classification and attributes
paths:
  /products/{productCode}/classifications:
    get:
      operationId: getProductClassifications
      summary: SAP Commerce Cloud Get product classifications
      description: Retrieve classification attributes and feature values for a product across classification categories.
      tags:
      - Classifications
      parameters:
      - $ref: '#/components/parameters/productCode'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Product classifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationList'
components:
  parameters:
    productCode:
      name: productCode
      in: path
      required: true
      description: Product code
      schema:
        type: string
    fields:
      name: fields
      in: query
      description: Response field configuration level. Use BASIC, DEFAULT, or FULL to control the amount of data returned.
      schema:
        type: string
        enum:
        - BASIC
        - DEFAULT
        - FULL
        default: DEFAULT
  schemas:
    Classification:
      type: object
      properties:
        code:
          type: string
          description: Classification category code
        name:
          type: string
          description: Classification category name
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
    ClassificationList:
      type: object
      properties:
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/Classification'
    Feature:
      type: object
      properties:
        code:
          type: string
          description: Feature code
        name:
          type: string
          description: Feature name
        comparable:
          type: boolean
          description: Whether this feature supports comparison
        featureUnit:
          type: object
          properties:
            symbol:
              type: string
            name:
              type: string
        featureValues:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication for SAP Commerce Cloud
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.{region}.commercecloud.sap/authorizationserver/oauth/token
          scopes:
            basic: Basic access
externalDocs:
  description: Product Content Management Documentation
  url: https://help.sap.com/docs/SAP_COMMERCE/d0224eca81e249cb821f2cdf45a82ace/
