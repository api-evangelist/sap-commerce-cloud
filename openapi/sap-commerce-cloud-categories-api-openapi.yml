openapi: 3.2.0
info:
  title: SAP Commerce Cloud Product Content Management Categories API
  description: API for managing product content in SAP Commerce Cloud including product images, descriptions, attributes, media, and catalog content. Provides operations for product data enrichment, media management, and content publication workflows.
  version: '2.0'
  contact:
    name: SAP Support
    url: https://support.sap.com/
  termsOfService: https://www.sap.com/about/legal/terms-of-use.html
servers:
- url: https://{tenant}.{region}.commercecloud.sap/occ/v2/{baseSiteId}
  description: SAP Commerce Cloud Production
  variables:
    tenant:
      description: Tenant identifier
      default: my-tenant
    region:
      description: Deployment region
      default: us
    baseSiteId:
      description: Base site identifier
      default: electronics
security:
- oauth2: []
tags:
- name: Categories
  description: Category content management
paths:
  /catalogs/{catalogId}/{catalogVersionId}/categories/{categoryId}:
    get:
      operationId: getCategoryContent
      summary: SAP Commerce Cloud Get category content
      description: Retrieve content for a specific category including images, descriptions, and subcategories.
      tags:
      - Categories
      parameters:
      - name: catalogId
        in: path
        required: true
        description: Catalog identifier
        schema:
          type: string
      - name: catalogVersionId
        in: path
        required: true
        description: Catalog version identifier
        schema:
          type: string
      - name: categoryId
        in: path
        required: true
        description: Category identifier
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Category content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryContent'
        '404':
          description: Category not found
components:
  schemas:
    CategoryContent:
      type: object
      properties:
        code:
          type: string
          description: Category code
        name:
          type: string
          description: Category name
        description:
          type: string
          description: Category description
        image:
          $ref: '#/components/schemas/Image'
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        products:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
    CategoryRef:
      type: object
      properties:
        code:
          type: string
          description: Category code
        name:
          type: string
          description: Category name
        url:
          type: string
          description: Category URL
    Image:
      type: object
      properties:
        url:
          type: string
          description: Image URL
        altText:
          type: string
          description: Alternative text
        format:
          type: string
          description: Image format (thumbnail, product, zoom, cartIcon)
        imageType:
          type: string
          enum:
          - PRIMARY
          - GALLERY
          description: Image type
        galleryIndex:
          type: integer
          description: Position in gallery
  parameters:
    fields:
      name: fields
      in: query
      description: Response field configuration level. Use BASIC, DEFAULT, or FULL to control the amount of data returned.
      schema:
        type: string
        enum:
        - BASIC
        - DEFAULT
        - FULL
        default: DEFAULT
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication for SAP Commerce Cloud
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.{region}.commercecloud.sap/authorizationserver/oauth/token
          scopes:
            basic: Basic access
externalDocs:
  description: Product Content Management Documentation
  url: https://help.sap.com/docs/SAP_COMMERCE/d0224eca81e249cb821f2cdf45a82ace/
