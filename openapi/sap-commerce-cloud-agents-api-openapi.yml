openapi: 3.2.0
info:
  title: SAP Commerce Cloud Assisted Service Module Agents API
  description: REST API for assisted service capabilities in SAP Commerce Cloud, enabling customer service representatives (CSRs) to assist customers with their shopping experience. Provides operations for customer lookup, cart emulation, session management, and customer 360 view.
  version: '1.0'
  contact:
    name: SAP Support
    url: https://support.sap.com/
  termsOfService: https://www.sap.com/about/legal/terms-of-use.html
servers:
- url: https://{tenant}.{region}.commercecloud.sap/assistedservicewebservices
  description: SAP Commerce Cloud Production
  variables:
    tenant:
      description: Tenant identifier
      default: my-tenant
    region:
      description: Deployment region
      default: us
security:
- oauth2: []
tags:
- name: Agents
  description: Customer service agent operations
paths:
  /agents/{agentId}:
    get:
      operationId: getAgent
      summary: SAP Commerce Cloud Get agent details
      description: Retrieve details of a customer service agent.
      tags:
      - Agents
      parameters:
      - name: agentId
        in: path
        required: true
        description: Agent identifier
        schema:
          type: string
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: Agent not found
components:
  schemas:
    Agent:
      type: object
      properties:
        uid:
          type: string
          description: Agent unique identifier
        name:
          type: string
          description: Agent full name
        email:
          type: string
          description: Agent email
        groups:
          type: array
          items:
            type: string
          description: Agent permission groups
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication for SAP Commerce Cloud
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.{region}.commercecloud.sap/authorizationserver/oauth/token
          scopes:
            basic: Basic access
            assistedservicegroup: Assisted service agent access
externalDocs:
  description: Assisted Service Module Documentation
  url: https://help.sap.com/docs/SAP_COMMERCE/9d346683b0084da2938be8a285c0c27a/8b571515866910148fc18b9e59d3e084.html
