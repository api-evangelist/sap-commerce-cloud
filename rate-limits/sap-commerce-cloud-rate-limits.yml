specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: SAP Commerce Cloud
providerId: sap-commerce-cloud
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - B2B
  - B2C
  - Commerce
  - Customer Experience
  - Ecommerce
  - Omnichannel
  - Retail
description: SAP Commerce Cloud OCC (Omni Commerce Connect) APIs document rate-limit headers and throttling per endpoint on the SAP Help Portal; effective limits depend on the customer's environment sizing.
sources:
  - https://www.sap.com/products/crm/commerce-cloud.html
  - https://help.sap.com/docs/SAP_COMMERCE_CLOUD_PUBLIC_CLOUD
notes: Provider documentation pages render via client-side JavaScript or sit behind a partner portal; static rate-limit numbers are not exposed to automated fetches. Reconcile from the per-product SAP Help Portal section or partner developer portal.
responseCodes:
  throttled: 429
limits:
  - name: Per-service quotas
    scope: account/region/service
    metric: varies
    limit: see provider documentation; gated or partner-only
policies:
  - name: Documentation location
    description: Rate limits are documented per service in the SAP Help Portal or the SAP Concur developer
      portal; consult the relevant section for current numbers.
  - name: Contract-governed
    description: Effective limits depend on the customer's BTP entitlement, partner application, or negotiated
      contract.
